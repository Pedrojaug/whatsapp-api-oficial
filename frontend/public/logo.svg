<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100" fill="none">
  <!-- Ícone do Balão com Linhas e S -->
  <g transform="translate(10, 10)">
    <!-- Balão com cauda inferior contendo o 'S' -->
    <path 
      d="M24 0 H68 C81.25 0 92 10.75 92 24 V56 C92 69.25 81.25 80 68 80 H44 C42 80 39 82 38 84 L36 88 C34 92 30 94 26 92 C23 90.5 21 87 21 83 V80 H24 C10.75 80 0 69.25 0 56 V24 C0 10.75 10.75 0 24 0 Z" 
      stroke="#00c26b" 
      stroke-width="7.5" 
      stroke-linejoin="round"
      fill="none"
    />
    <!-- 3 Linhas de Mensagem Internas -->
    <rect x="18" y="22" width="40" height="7.5" rx="3.75" fill="#00c26b" />
    <rect x="18" y="38" width="28" height="7.5" rx="3.75" fill="#00c26b" />
    <rect x="18" y="54" width="16" height="7.5" rx="3.75" fill="#00c26b" />
    
    <!-- Monograma 'S' estilizado na cauda -->
    <path
      d="M32 70 C28 70 25 73 25 77 C25 81 29 82 33 84 C37 86 40 88 40 93 C40 98 35 101 30 101 C24 101 20 97 20 92"
      stroke="#00c26b"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Tipografia Oficial: Send Inteligentte -->
  <text x="135" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#00c26b">Send</tspan>
    <tspan fill="#ffffff" dx="10">Inteligentte</tspan>
  </text>
</svg>
